<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>TrakTym</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   <header class="hero">
    <div class="container">
        <div id="next-race-strip" class="next-session-strip">
            <span class="next-session-label">Next race in your timezone</span>
            <span id="next-race-detail">—</span>
            <span id="user-tz-label" class="user-tz-label"></span>
        </div>
        <div id="next-badge" class="badge">GRAND PRIX</div>
        <h1 id="race-name">Loading...</h1>
        <div class="location-box">
            <span class="pin">📍</span>
            <span id="race-location">Detecting...</span>
        </div>
        <div id="countdown-block" class="countdown-block">
            <span class="countdown-label">Time until race start</span>
            <div id="countdown-display" class="countdown-display" aria-live="polite">—</div>
        </div>

       <div class="slider-wrapper">
    <p class="slider-hint">Scroll to select a Grand Prix</p>
    
    <div class="nav-container">
        <button id="prev-btn" class="slider-nav prev">❮</button>
        
        <div id="race-slider" class="race-slider">
            </div>
        
        <button id="next-btn" class="slider-nav next">❯</button>
    </div>
</div>
    </div>
</header>
     <div class="container">
        <div class="slider-wrapper">
            <p class="slider-hint" text-align="center">Select a city in your timezone to see session timings</p>
        </div>
    </div>
    <main class="container">
        <div id="continent-grid" class="continent-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
